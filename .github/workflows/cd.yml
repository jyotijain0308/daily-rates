name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DEFAULT_CPANEL_HOST: 66.116.209.154
  DEFAULT_CPANEL_PORT: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q app db.py wsgi.py passenger_wsgi.py

      - name: Run tests
        env:
          PYTHONWARNINGS: default
        run: python -m unittest tests/test_api.py

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail

          if [ -z "${CPANEL_USER}" ] || [ -z "${CPANEL_SSH_KEY}" ] || [ -z "${CPANEL_APP_DIR}" ]; then
            echo "Missing cPanel SSH secrets. Set CPANEL_USER, CPANEL_SSH_KEY, and CPANEL_APP_DIR."
            exit 1
          fi

          if [ -z "${CPANEL_HOST:-${DEFAULT_CPANEL_HOST}}" ]; then
            echo "Missing cPanel host. Set CPANEL_HOST or update DEFAULT_CPANEL_HOST in this workflow."
            exit 1
          fi

          if [ -z "${DATABASE_URL}" ] || [ -z "${SECRET_KEY}" ]; then
            echo "Missing application secrets. Set DATABASE_URL and SECRET_KEY."
            exit 1
          fi

          if [ -z "${PRODUCTION_ENV}" ]; then
            echo "Missing PRODUCTION_ENV repository secret. Add .env-style production settings there."
            exit 1
          fi

          case "${DATABASE_URL}" in
            postgres://*|postgresql://*|postgresql+psycopg://*|mysql://*|mysql+pymysql://*) ;;
            *)
              echo "DATABASE_URL must point to PostgreSQL or MySQL."
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || env.DEFAULT_CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || env.DEFAULT_CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${CPANEL_SSH_KEY}" | tr -d '\r' > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keygen -y -f ~/.ssh/cpanel_key > /dev/null
          ssh-keyscan -p "${CPANEL_PORT}" -H "${CPANEL_HOST}" >> ~/.ssh/known_hosts

      - name: Upload source
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || env.DEFAULT_CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || env.DEFAULT_CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/cpanel_key \
            -p "${CPANEL_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "mkdir -p '${CPANEL_APP_DIR}' '${CPANEL_APP_DIR}/uploads' '${CPANEL_APP_DIR}/output' '${CPANEL_APP_DIR}/instance' '${CPANEL_APP_DIR}/tmp'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/cpanel_key -p ${CPANEL_PORT} -o BatchMode=yes -o IdentitiesOnly=yes" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "instance/" \
            --exclude "output/" \
            --exclude "uploads/" \
            ./ "${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_APP_DIR}/"

          rsync -az \
            -e "ssh -i ~/.ssh/cpanel_key -p ${CPANEL_PORT} -o BatchMode=yes -o IdentitiesOnly=yes" \
            uploads/assets/ "${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_APP_DIR}/uploads/assets/"

      - name: Configure and restart app
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || env.DEFAULT_CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || env.DEFAULT_CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
          CPANEL_PYTHON: ${{ secrets.CPANEL_PYTHON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail

          ENV_FILE="$(mktemp)"
          {
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'SECRET_KEY=%s\n' "${SECRET_KEY}"
            printf '\n'
            printf '%s\n' "${PRODUCTION_ENV}"
          } >> "${ENV_FILE}"

          scp -i ~/.ssh/cpanel_key \
            -P "${CPANEL_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${ENV_FILE}" "${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_APP_DIR}/.env"
          rm -f "${ENV_FILE}"

          printf -v REMOTE_ENV \
            "CPANEL_APP_DIR=%q CPANEL_PYTHON=%q" \
            "$CPANEL_APP_DIR" \
            "${CPANEL_PYTHON:-}"

          ssh -i ~/.ssh/cpanel_key \
            -p "${CPANEL_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "${REMOTE_ENV} bash -s" <<'EOF'
          set -euo pipefail

          cd "$CPANEL_APP_DIR"
          USE_MANAGED_PYTHON=false
          if [ -n "${CPANEL_PYTHON:-}" ]; then
            PYTHON_BIN="$CPANEL_PYTHON"
            USE_MANAGED_PYTHON=true
          else
            PYTHON_BIN=""
            for candidate in python3.12 python3.11 python3.10 python3.9 python3 python; do
              if command -v "$candidate" >/dev/null 2>&1; then
                PYTHON_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$PYTHON_BIN" ]; then
            echo "No Python 3 interpreter found. Set CPANEL_PYTHON to the Python path shown in cPanel."
            exit 1
          fi

          "$PYTHON_BIN" - <<'PY'
          import sys

          if sys.version_info < (3, 9):
              raise SystemExit(f"Python 3.9+ is required, found {sys.version.split()[0]}")
          print(f"Using Python {sys.version.split()[0]}")
          PY

          if [ "$USE_MANAGED_PYTHON" = true ]; then
            APP_PYTHON="$PYTHON_BIN"
          else
            if [ -d .venv ] && ! .venv/bin/python -c 'import sys; print(sys.version)' >/dev/null 2>&1; then
              echo "Existing virtualenv is unusable; recreating it."
              rm -rf .venv
            fi

            if [ ! -x .venv/bin/python ]; then
              "$PYTHON_BIN" -m venv --copies .venv
            fi
            APP_PYTHON=".venv/bin/python"
          fi

          "$APP_PYTHON" -m pip install --upgrade pip
          "$APP_PYTHON" -m pip install -r requirements.txt

          "$APP_PYTHON" -m flask --app 'wsgi:create_app' db upgrade
          "$APP_PYTHON" - <<'PY'
          import json
          from wsgi import create_app

          app = create_app()
          with app.test_client() as client:
              response = client.get("/health")
              assert response.status_code == 200, response.get_data(as_text=True)
              payload = json.loads(response.get_data(as_text=True))
              assert payload["status"] == "healthy", payload
          PY

          mkdir -p tmp
          touch tmp/restart.txt
          EOF
