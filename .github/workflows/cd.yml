name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment name
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: ppt-daily-rates
  APP_DIR: /opt/ppt-daily-rates

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest tests/test_api.py

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.AWS_HOST || secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_USER || secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_KEY || secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "Missing one or more required SSH secrets."
            echo "Set EC2_HOST, EC2_USER, EC2_SSH_KEY as repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/aws_ec2_key
          chmod 600 ~/.ssh/aws_ec2_key
          ssh-keygen -y -f ~/.ssh/aws_ec2_key > /dev/null
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy container
        env:
          SSH_HOST: ${{ secrets.AWS_HOST || secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_USER || secrets.EC2_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PDF_TABLE_EXTRACTION_PROVIDER: ${{ secrets.PDF_TABLE_EXTRACTION_PROVIDER }}
          OPENAI_PDF_EXTRACTION_MODEL: ${{ secrets.OPENAI_PDF_EXTRACTION_MODEL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_PDF_EXTRACTION_MODEL: ${{ secrets.OLLAMA_PDF_EXTRACTION_MODEL }}
        run: |
          set -euo pipefail

          printf -v REMOTE_ENV \
            "IMAGE=%q GHCR_USERNAME=%q GHCR_TOKEN=%q CONTAINER_NAME=%q APP_DIR=%q POSTGRES_DB=%q POSTGRES_USER=%q POSTGRES_PASSWORD=%q DATABASE_URL=%q OPENAI_API_KEY=%q PDF_TABLE_EXTRACTION_PROVIDER=%q OPENAI_PDF_EXTRACTION_MODEL=%q OLLAMA_BASE_URL=%q OLLAMA_PDF_EXTRACTION_MODEL=%q" \
            "$IMAGE" \
            "$GHCR_USERNAME" \
            "$GHCR_TOKEN" \
            "$CONTAINER_NAME" \
            "$APP_DIR" \
            "$POSTGRES_DB" \
            "$POSTGRES_USER" \
            "$POSTGRES_PASSWORD" \
            "$DATABASE_URL" \
            "$OPENAI_API_KEY" \
            "$PDF_TABLE_EXTRACTION_PROVIDER" \
            "$OPENAI_PDF_EXTRACTION_MODEL" \
            "$OLLAMA_BASE_URL" \
            "$OLLAMA_PDF_EXTRACTION_MODEL"

          ssh -i ~/.ssh/aws_ec2_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "${REMOTE_ENV} bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -d "$APP_DIR" ] || [ ! -w "$APP_DIR" ]; then
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"
          fi

          mkdir -p "$APP_DIR"/{instance,output,uploads,assets}
          APP_NETWORK="${CONTAINER_NAME}-network"
          POSTGRES_CONTAINER_NAME="${CONTAINER_NAME}-postgres"
          POSTGRES_VOLUME_NAME="${CONTAINER_NAME}-postgres-data"

          if [ -z "${DATABASE_URL:-}" ]; then
            if [ -z "${POSTGRES_DB:-}" ] || [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "Missing database secrets. Set DATABASE_URL, or set POSTGRES_DB, POSTGRES_USER, and POSTGRES_PASSWORD."
              exit 1
            fi
            DATABASE_URL="$(POSTGRES_CONTAINER_NAME="$POSTGRES_CONTAINER_NAME" python3 - <<'PY'
          import os
          import sys
          from urllib.parse import quote

          user = quote(os.environ["POSTGRES_USER"], safe="")
          password = quote(os.environ["POSTGRES_PASSWORD"], safe="")
          database = quote(os.environ["POSTGRES_DB"], safe="")
          host = os.environ.get("POSTGRES_CONTAINER_NAME")
          if not host:
              sys.exit("POSTGRES_CONTAINER_NAME was not provided to DATABASE_URL builder")
          print(f"postgresql+psycopg://{user}:{password}@{host}:5432/{database}")
          PY
          )"
          fi

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          docker pull "$IMAGE"
          docker network create "$APP_NETWORK" 2>/dev/null || true

          if [ -n "${POSTGRES_DB:-}" ] && [ -n "${POSTGRES_USER:-}" ] && [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker volume create "$POSTGRES_VOLUME_NAME" >/dev/null

            if docker ps -a --format '{{.Names}}' | grep -Fxq "$POSTGRES_CONTAINER_NAME"; then
              docker start "$POSTGRES_CONTAINER_NAME" >/dev/null
            else
              docker run -d \
                --name "$POSTGRES_CONTAINER_NAME" \
                --restart unless-stopped \
                --network "$APP_NETWORK" \
                -e POSTGRES_DB="$POSTGRES_DB" \
                -e POSTGRES_USER="$POSTGRES_USER" \
                -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
                -v "$POSTGRES_VOLUME_NAME:/var/lib/postgresql/data" \
                postgres:16-alpine
            fi
            docker network connect "$APP_NETWORK" "$POSTGRES_CONTAINER_NAME" 2>/dev/null || true

            for attempt in $(seq 1 30); do
              if docker exec "$POSTGRES_CONTAINER_NAME" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "PostgreSQL did not become ready in time."
                docker logs "$POSTGRES_CONTAINER_NAME" || true
                exit 1
              fi
              sleep 2
            done

            POSTGRES_USER_IDENT="$(POSTGRES_USER="$POSTGRES_USER" python3 - <<'PY'
          import os
          user = os.environ["POSTGRES_USER"]
          print('"' + user.replace('"', '""') + '"')
          PY
          )"

            POSTGRES_PASSWORD_LITERAL="$(POSTGRES_PASSWORD="$POSTGRES_PASSWORD" python3 - <<'PY'
          import os
          password = os.environ["POSTGRES_PASSWORD"]
          print("'" + password.replace("'", "''") + "'")
          PY
          )"

            printf 'ALTER USER %s WITH PASSWORD %s;\n' "$POSTGRES_USER_IDENT" "$POSTGRES_PASSWORD_LITERAL" | \
              docker exec -i "$POSTGRES_CONTAINER_NAME" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          fi

          # Seed the persistent assets volume from the image on first deploy only.
          if [ -z "$(find "$APP_DIR/assets" -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
            TEMP_CONTAINER="$(docker create "$IMAGE")"
            docker cp "$TEMP_CONTAINER:/app/src/assets/." "$APP_DIR/assets/"
            docker rm "$TEMP_CONTAINER"
          fi

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true
          EXISTING_PORT_80_CONTAINER="$(docker ps --filter publish=80 --format '{{.ID}}' | head -n 1 || true)"
          if [ -n "$EXISTING_PORT_80_CONTAINER" ]; then
            docker stop "$EXISTING_PORT_80_CONTAINER"
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$APP_NETWORK" \
            --add-host host.docker.internal:host-gateway \
            -p 80:8000 \
            -e PORT=8000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            -e PDF_TABLE_EXTRACTION_PROVIDER="${PDF_TABLE_EXTRACTION_PROVIDER:-ollama}" \
            -e OPENAI_PDF_EXTRACTION_MODEL="${OPENAI_PDF_EXTRACTION_MODEL:-gpt-4o-mini}" \
            -e OLLAMA_BASE_URL="${OLLAMA_BASE_URL:-http://host.docker.internal:11434}" \
            -e OLLAMA_PDF_EXTRACTION_MODEL="${OLLAMA_PDF_EXTRACTION_MODEL:-llama3.2-vision}" \
            -v "$APP_DIR/instance:/app/instance" \
            -v "$APP_DIR/output:/app/output" \
            -v "$APP_DIR/uploads:/app/uploads" \
            -v "$APP_DIR/assets:/app/src/assets" \
            "$IMAGE"

          docker image prune -f

          for attempt in $(seq 1 30); do
            if ! docker ps -a --format '{{.Names}}' | grep -Fxq "$CONTAINER_NAME"; then
              echo "Application container was not created."
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true" ]; then
              if docker exec "$CONTAINER_NAME" python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
              payload = json.loads(response.read().decode("utf-8"))
              assert payload["status"] == "healthy", payload
          PY
              then
                exit 0
              fi
            else
              echo "Application container exited before becoming healthy."
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            sleep 2
          done

          echo "Application container did not become healthy in time."
          docker logs "$CONTAINER_NAME" || true
          exit 1
          EOF
