{% extends "base.html" %}

{% block title %}Sign In — Taaza Rates{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <h1>Sign In</h1>
        <p class="subtitle">Use your company account to continue.</p>
        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="input" value="{{ email }}" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        </form>
        <p class="auth-switch">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up under your registered company</a></p>
    </div>
</section>
{% endblock %}
