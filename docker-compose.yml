services:
  postgres:
    image: postgres:16-alpine
    container_name: flask-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-app:
    build: .
    container_name: flask-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PDF_TABLE_EXTRACTION_PROVIDER: ${PDF_TABLE_EXTRACTION_PROVIDER:-ollama}
      OPENAI_PDF_EXTRACTION_MODEL: ${OPENAI_PDF_EXTRACTION_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_PDF_EXTRACTION_MODEL: ${OLLAMA_PDF_EXTRACTION_MODEL:-llama3.2-vision}
      PRODUCT_IMAGE_AUTO_FETCH: ${PRODUCT_IMAGE_AUTO_FETCH:-true}
      PRODUCT_IMAGE_PREFETCH_ON_GENERATE: ${PRODUCT_IMAGE_PREFETCH_ON_GENERATE:-true}
      PRODUCT_IMAGE_PREFETCH_LIMIT: ${PRODUCT_IMAGE_PREFETCH_LIMIT:-20}
      PRODUCT_IMAGE_FETCH_TIMEOUT_SECONDS: ${PRODUCT_IMAGE_FETCH_TIMEOUT_SECONDS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_data:
