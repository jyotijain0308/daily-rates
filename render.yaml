services:
  - type: web
    name: taaza-rates
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "wsgi:create_app()" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: APP_URL
        value: https://rates.easternfarmsllc.com
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
